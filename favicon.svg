<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fleetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fleetGrad)" filter="url(#glow)"/>

  <!-- Satellite Icon Group (Centered & Angled) -->
  <g transform="translate(32,32) rotate(-25) translate(-32,-32)">
    <!-- Left Solar Panel -->
    <rect x="13" y="28" width="10" height="8" rx="1.5" fill="url(#panelGrad)" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="18" y1="28" x2="18" y2="36" stroke="#0284C7" stroke-width="0.8"/>
    <line x1="23" y1="32" x2="26" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Central Satellite Bus / Core -->
    <rect x="26" y="26" width="12" height="12" rx="2.5" fill="#FFFFFF"/>
    <rect x="28.5" y="28.5" width="7" height="7" rx="1" fill="#0284C7"/>

    <!-- Right Solar Panel -->
    <line x1="38" y1="32" x2="41" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="41" y="28" width="10" height="8" rx="1.5" fill="url(#panelGrad)" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="46" y1="28" x2="46" y2="36" stroke="#0284C7" stroke-width="0.8"/>

    <!-- Parabolic Dish / Antenna -->
    <path d="M 24 43 Q 32 47 40 43" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="32" y2="45" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="32" cy="46" r="1.5" fill="#38BDF8"/>
    
    <!-- Signal Radio Beams -->
    <path d="M 26 50 Q 32 53 38 50" fill="none" stroke="#E0F2FE" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2,2"/>
    <path d="M 23 54 Q 32 58 41 54" fill="none" stroke="#BAE6FD" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- GPS Online Ping Beacon in Top-Right Corner -->
  <circle cx="52" cy="12" r="5" fill="#34D399" opacity="0.5"/>
  <circle cx="52" cy="12" r="3.2" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
</svg>
